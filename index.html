<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Playroom · 开源小游戏</title>
  <style>
    :root{color-scheme:light;--bg:#f5f6f8;--ink:#202329;--muted:#717680;--line:#e1e4e9;--accent:#e94a64;--paper:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}button,input,a{-webkit-tap-highlight-color:transparent}button,input{font:inherit}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e94a6470;outline-offset:4px}button:disabled{cursor:default}
    .wrap{max-width:1184px;margin:auto;padding:0 32px}header{border-bottom:1px solid var(--line);background:#ffffffb8}.nav{height:80px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:850}.brand-mark{width:35px;height:35px;display:grid;place-items:center;background:var(--ink);color:white;border-radius:7px;font-size:22px}.brand span:last-child{color:var(--accent)}.nav-note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;background:#42a477;border-radius:50%}
    main{padding-top:38px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}.eyebrow{font:11px/1.5 ui-monospace,monospace;color:var(--accent);font-weight:700;margin:0 0 8px}h1{font-size:36px;line-height:1.25;margin:0 0 10px;font-weight:800}.intro p:not(.eyebrow){color:var(--muted);margin:0;font-size:14px}.counter{font:12px ui-monospace,monospace;color:var(--muted);white-space:nowrap;margin-bottom:5px}.counter strong{font-size:28px;color:var(--ink);margin-right:7px}
    .spotlight{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);min-height:280px;background:#20262b;color:white;overflow:hidden;position:relative;margin-bottom:33px}.spotlight-visual{position:relative;min-height:280px;overflow:hidden;background:#d7f1e8}.spotlight-visual img{width:100%;height:100%;position:absolute;object-fit:cover}.spotlight-body{padding:30px 36px;display:flex;flex-direction:column;align-items:start;justify-content:center}.tagline{font:11px ui-monospace,monospace;color:#93cdb8;margin-bottom:12px;display:flex;align-items:center;gap:8px}.tagline:before{content:"";height:6px;width:6px;background:#93cdb8}.spotlight h2{font-size:30px;line-height:1.2;margin:0 0 10px}.spotlight p{font-size:13px;color:#b9bfc6;margin:0 0 22px;max-width:300px}.primary{display:inline-flex;align-items:center;justify-content:center;gap:20px;min-height:42px;background:#fff;color:var(--ink);padding:9px 17px;font-size:13px;font-weight:700;border:0;border-radius:4px}.primary:hover{background:#d7f1e8}.arrow{font-size:20px;line-height:1}.spotlight-source{margin-top:14px;color:#bdc5cc;font-size:11px;text-decoration:underline;text-underline-offset:4px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 0 22px}.filters{display:flex;flex-wrap:wrap;gap:7px}.filter{background:none;border:1px solid transparent;border-radius:4px;padding:7px 13px;color:var(--muted);font-size:13px;min-height:37px}.filter:hover{background:#e9ecf0;color:var(--ink)}.filter[aria-pressed=true]{background:var(--ink);color:#fff}.search{position:relative;width:240px;flex-shrink:0}.search svg{position:absolute;left:12px;top:12px;color:#8c929b;width:16px;height:16px}.search input{width:100%;height:40px;padding:8px 12px 8px 36px;border:1px solid var(--line);border-radius:5px;background:white;font-size:13px;color:var(--ink)}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-heading h2{font-size:15px;margin:0}.section-heading span{font:11px ui-monospace,monospace;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:hidden;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-4px);border-color:#aeb6c1}.cover{display:block;position:relative;aspect-ratio:16/10;overflow:hidden;background:#e7ebee}.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.card:hover .cover img{transform:scale(1.035)}.play-badge{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#202329;box-shadow:0 2px 12px #0002;font-size:12px;padding-left:2px}.card-body{padding:16px 18px 14px}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.card h3{font-size:17px;line-height:1.35;margin:0;font-weight:750}.category{font-size:10px;padding:2px 7px;background:#f0f2f5;color:#68707b;border-radius:3px;white-space:nowrap}.description{color:var(--muted);font-size:12px;margin:8px 0 16px;min-height:20px}.card-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0f3;padding-top:11px}.card-bottom span{color:#969ca5;font:10px ui-monospace,monospace}.source{font-size:11px;color:#65707a;display:inline-flex;gap:5px;align-items:center}.source:hover{color:var(--accent);text-decoration:underline}.source svg{width:13px;height:13px}.empty{text-align:center;padding:65px 16px;color:var(--muted)}.empty h3{color:var(--ink);font-size:18px;margin:0 0 6px}.reset{margin-top:12px;border:1px solid var(--line);background:#fff;padding:7px 18px;border-radius:4px;font-size:13px}[hidden]{display:none!important}footer{margin-top:44px;border-top:1px solid var(--line);padding:23px 0 28px}.footer-inner{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:11px}.footer-brand{font-weight:750;color:#505760}.footer-inner small{font-size:10px;color:#949aa3}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.spotlight{grid-template-columns:1.15fr 1fr}.spotlight-body{padding:25px}.toolbar{align-items:start;flex-direction:column;gap:14px}.search{width:100%}h1{font-size:30px}}
    @media(max-width:520px){.wrap{padding:0 20px}.nav{height:68px}.brand{font-size:21px}.nav-note{font-size:10px}main{padding-top:28px}.intro{align-items:start}.intro p:not(.eyebrow){max-width:220px;font-size:12px}h1{font-size:28px}.counter{font-size:10px;padding-top:25px}.counter strong{font-size:21px}.spotlight{grid-template-columns:1fr}.spotlight-visual{min-height:190px;aspect-ratio:16/8}.spotlight-body{padding:23px 24px}.spotlight h2{font-size:26px}.spotlight p{margin-bottom:17px}.spotlight-source{margin-top:10px}.grid{gap:15px 12px}.card-body{padding:12px}.card-top{align-items:start;flex-direction:column;gap:6px}.card h3{font-size:15px;overflow-wrap:anywhere}.description{font-size:11px;min-height:36px;margin:7px 0 11px}.category{font-size:9px}.card-bottom{gap:4px;flex-wrap:wrap}.card-bottom span{font-size:9px}.source{font-size:10px}.play-badge{width:26px;height:26px;right:8px;bottom:8px}.filters{gap:3px}.filter{padding:6px 10px;font-size:12px}.footer-inner{align-items:start;flex-direction:column}.section-heading span{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><a class="brand" href="./index.html" aria-label="Playroom 首页"><span class="brand-mark" aria-hidden="true">▦</span>Playroom<span>.</span></a><div class="nav-note"><span class="dot"></span>小小的游戏，大大的快乐</div></div></header>
  <main class="wrap">
    <div class="intro"><div><p class="eyebrow">THE OPEN-SOURCE ARCADE / VOL. 01</p><h1>给快乐，留一点时间。</h1><p>发现好玩的开源小游戏，随时开启下一局。</p></div><div class="counter"><strong id="total">06</strong>款游戏</div></div>
    <section class="spotlight" aria-labelledby="featured-title"><div class="spotlight-visual"><img id="featured-cover" alt="2048 数字方块插画封面" width="800" height="500"></div><div class="spotlight-body"><div class="tagline">PICK OF THE DAY · 编辑精选</div><h2 id="featured-title">2048</h2><p>滑动、合并，再试一次。简单的数字里，藏着让人停不下来的挑战。</p><a id="featured-play" class="primary" href="https://play2048.co/" target="_blank" rel="noopener noreferrer">开始游戏 <span class="arrow" aria-hidden="true">↗</span></a><a class="spotlight-source" href="https://github.com/gabrielecirulli/2048" target="_blank" rel="noopener noreferrer">查看开源项目 ↗</a></div></section>
    <div class="toolbar"><nav class="filters" aria-label="游戏分类" id="filters"></nav><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="搜索游戏…" aria-label="搜索游戏" autocomplete="off"></label></div>
    <div class="section-heading"><h2 id="list-title">全部游戏</h2><span id="result-count" aria-live="polite"></span></div>
    <section class="grid" id="games" aria-label="游戏列表"></section>
    <div class="empty" id="empty" hidden><h3>还没找到这款游戏</h3><div>换个关键词，或者看看其他分类。</div><button type="button" class="reset" id="reset">查看全部游戏</button></div>
    <noscript><p>请启用 JavaScript 以显示游戏列表。你也可以直接访问 <a href="https://play2048.co/">2048</a>。</p></noscript>
  </main>
  <footer><div class="wrap footer-inner"><span class="footer-brand">Playroom. <span style="font-weight:400">保持好奇，保持好玩。</span></span><small>封面为像素插画 · 游戏版权及许可归各项目所有</small></div></footer>
  <script>
    // 添加游戏时修改此清单。使用相对路径即可部署到 GitHub Pages 项目目录。
    // cover: "images/game.jpg", url: "games/game/index.html"
    const games = [
      {name:"灯火守夜人",category:"解谜",description:"雨落之前，把灯火带回家",url:"shouyeren/index.html",source:"img/shouye.png",art:"灯火夜归人",cover:"",color:"#d7f1e8"},
      {name:"2048",category:"益智",description:"让相同数字相遇，向 2048 进发。",url:"https://play2048.co/",source:"https://github.com/gabrielecirulli/2048",art:"2048",cover:"",color:"#d7f1e8"},
      {name:"Hextris",category:"益智",description:"旋转六边形，接住不断落下的色彩。",url:"https://hextris.io/",source:"https://github.com/Hextris/hextris",art:"hex",cover:"",color:"#e7e3f5"},
      {name:"Clumsy Bird",category:"街机",description:"轻轻一跃，穿过下一道障碍。",url:"https://ellisonleao.github.io/clumsy-bird/",source:"https://github.com/ellisonleao/clumsy-bird",art:"bird",cover:"",color:"#d8edf7"},
      {name:"HexGL",category:"竞速",description:"驾驶未来飞船，在赛道上全速前进。",url:"https://hexgl.bkcore.com/play/",source:"https://github.com/BKcore/HexGL",art:"race",cover:"",color:"#dce7ed"},
      {name:"0h h1",category:"逻辑",description:"红蓝之间，用逻辑填满每一个空格。",url:"https://0hh1.com/",source:"https://github.com/Q42/0hh1",art:"board",cover:"",color:"#f4e8ca"},
      {name:"JavaScript Tetris",category:"街机",description:"旋转、落下、消除，经典永不过时。",url:"https://jakesgordon.com/javascript/tetris/",source:"https://github.com/jakesgordon/javascript-tetris",art:"tetris",cover:"",color:"#f8dfe5"}
    ];
    const grid=document.querySelector('#games'),search=document.querySelector('#search'),filters=document.querySelector('#filters');
    let category='全部';
    const sourceIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/></svg>';
    // Canvas 生成内置位图封面；填入 cover 后优先使用实际游戏截图。
    function coverArt(game){
      const canvas=document.createElement('canvas');canvas.width=800;canvas.height=500;
      const c=canvas.getContext('2d');c.fillStyle=game.color;c.fillRect(0,0,800,500);
      const rect=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h)};
      const circle=(x,y,r,color)=>{c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()};
      c.fillStyle='#ffffff55';for(let x=20;x<800;x+=35)for(let y=20;y<500;y+=35)c.fillRect(x,y,2,2);
      if(game.art==='2048'){
        rect(229,64,342,372,'#87af9f');rect(218,53,342,372,'#adcbbd');
        const values=[2,4,8,16,32,64,128,256,2048],colors=['#f7faf3','#edf3d9','#e7cf8e','#edaa75','#ec876a','#e56560','#eacb5e','#dfb947','#efcf53'];
        values.forEach((v,i)=>{let x=230+i%3*107,y=65+Math.floor(i/3)*116;rect(x,y,99,108,colors[i]);c.fillStyle=i<2?'#56665c':'#fff';c.font=`bold ${v===2048?27:35}px system-ui`;c.textAlign='center';c.textBaseline='middle';c.fillText(v,x+49.5,y+54)});
      }else if(game.art==='hex'){
        const hex=(r,width,color,rotation=0)=>{c.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3+rotation;c.lineTo(400+Math.cos(a)*r,250+Math.sin(a)*r)}c.closePath();c.strokeStyle=color;c.lineWidth=width;c.stroke()};
        hex(147,27,'#b3a9d5');hex(109,26,'#e895ac');hex(71,25,'#779ebc');hex(35,30,'#5d637e');
        rect(386,23,28,38,'#e895ac');rect(640,247,45,27,'#779ebc');rect(158,330,45,27,'#b3a9d5');
      }else if(game.art==='bird'){
        rect(0,401,800,99,'#9ec694');rect(0,401,800,12,'#658d69');
        [[130,160],[560,230]].forEach(([x,gap])=>{rect(x,0,88,gap-55,'#6aa783');rect(x-7,gap-75,102,25,'#4b8968');rect(x,gap+100,88,301-gap,'#6aa783');rect(x-7,gap+100,102,25,'#4b8968')});
        rect(330,218,68,52,'#f0bf53');rect(321,232,31,25,'#e6a64c');rect(377,218,20,24,'#fff');rect(387,222,9,12,'#303944');rect(397,244,28,12,'#e97e62');
        [[44,98],[410,75],[680,130]].forEach(([x,y])=>{rect(x,y,85,20,'#ffffffb3');rect(x+18,y-16,45,20,'#ffffffb3')});
      }else if(game.art==='race'){
        rect(0,0,800,205,'#c5dce7');for(let i=0;i<12;i++)rect(i*75,110+(i%3)*20,44,95,'#99b3c1');
        c.fillStyle='#667780';c.beginPath();c.moveTo(320,190);c.lineTo(480,190);c.lineTo(800,500);c.lineTo(0,500);c.fill();
        c.strokeStyle='#a0ecce';c.lineWidth=9;c.beginPath();c.moveTo(322,190);c.lineTo(50,500);c.moveTo(478,190);c.lineTo(750,500);c.stroke();
        for(let y=220;y<500;y+=65)rect(395,y,10,30,'#dce5e8');
        c.fillStyle='#f7f9fa';c.beginPath();c.moveTo(400,285);c.lineTo(475,410);c.lineTo(400,385);c.lineTo(325,410);c.closePath();c.fill();rect(390,327,20,45,'#e9637a');rect(345,414,17,35,'#72dbd0');rect(438,414,17,35,'#72dbd0');
      }else if(game.art==='board'){
        rect(215,65,370,370,'#e1d2b0');
        const cells=[1,2,0,1,0,2,2,0,1,2,1,0,0,1,2,0,2,1,1,2,1,2,0,0,2,0,0,1,2,1,0,1,2,0,1,2];
        cells.forEach((v,i)=>rect(225+i%6*60,75+Math.floor(i/6)*60,50,50,['#eee7d5','#ed7780','#6aa8c7'][v]));
      }else{
        rect(250,38,300,424,'#293b43');const blocks=[[0,11,4,'#89cfc0'],[0,10,2,'#edbd58'],[2,9,2,'#e995a7'],[4,11,3,'#86b3db'],[5,10,2,'#86b3db'],[0,9,1,'#edbd58'],[3,10,2,'#e995a7'],[1,6,3,'#a7a0d3'],[2,5,1,'#a7a0d3']];
        blocks.forEach(([x,y,n,col])=>{for(let i=0;i<n;i++){rect(264+(x+i)*38,51+y*32,33,28,col);rect(267+(x+i)*38,54+y*32,27,3,'#ffffff55')}});
        rect(378,87,32,28,'#e995a7');rect(410,87,32,28,'#e995a7');rect(410,119,32,28,'#e995a7');rect(442,119,32,28,'#e995a7');
      }
      return canvas.toDataURL('image/png');
    }
    const covers=new Map(games.map(g=>[g.name,coverArt(g)]));
    function setCover(img,game){img.src=game.cover||covers.get(game.name);img.alt=game.name+(game.cover?' 游戏截图':' 像素插画封面');img.addEventListener('error',()=>{img.src=covers.get(game.name)},{once:true})}
    function render(){
      const query=search.value.trim().toLocaleLowerCase();
      const visible=games.filter(g=>(category==='全部'||g.category===category)&&`${g.name} ${g.description} ${g.category}`.toLocaleLowerCase().includes(query));
      grid.replaceChildren();
      visible.forEach(game=>{
        const card=document.createElement('article');card.className='card';
        card.innerHTML='<a class="cover" target="_blank" rel="noopener noreferrer"><img width="800" height="500" loading="lazy"><span class="play-badge" aria-hidden="true">▶</span></a><div class="card-body"><div class="card-top"><h3></h3><span class="category"></span></div><p class="description"></p><div class="card-bottom"><span>HTML / OPEN SOURCE</span><a class="source" target="_blank" rel="noopener noreferrer">'+sourceIcon+' 源码 ↗</a></div></div>';
        const link=card.querySelector('.cover');link.href=game.url;link.setAttribute('aria-label','开始游戏：'+game.name+'（新窗口）');
        setCover(card.querySelector('img'),game);card.querySelector('h3').textContent=game.name;card.querySelector('.category').textContent=game.category;card.querySelector('.description').textContent=game.description;
        const source=card.querySelector('.source');source.href=game.source;source.setAttribute('aria-label',game.name+' 的开源代码（新窗口）');grid.append(card);
      });
      document.querySelector('#empty').hidden=visible.length>0;
      document.querySelector('#result-count').textContent=`${String(visible.length).padStart(2,'0')} GAMES`;
      document.querySelector('#list-title').textContent=category==='全部'?'全部游戏':category+'游戏';
      filters.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===category)));
    }
    ['全部',...new Set(games.map(g=>g.category))].forEach(name=>{const b=document.createElement('button');b.type='button';b.className='filter';b.textContent=name;b.addEventListener('click',()=>{category=name;render()});filters.append(b)});
    search.addEventListener('input',render);document.querySelector('#reset').addEventListener('click',()=>{category='全部';search.value='';render();search.focus()});
    document.querySelector('#total').textContent=String(games.length).padStart(2,'0');setCover(document.querySelector('#featured-cover'),games[0]);render();
    console.assert(new Set(games.map(g=>g.name)).size===games.length,'游戏名称应唯一');
  </script>
</body>
</html>
